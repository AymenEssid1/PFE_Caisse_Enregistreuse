name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        distribution: 'adopt'
        java-version: '17'

    # Build Eureka Server
    - name: Build eureka-server
      run: |
        cd Microservices/eureka-server
        mvn clean package -DskipTests

    # Build API Gateway
    - name: Build api-gateway
      run: |
        cd Microservices/API-Gateway
        mvn clean package -DskipTests

    # Build Stock Service
    - name: Build stock-service
      run: |
        cd Microservices/StockService
        mvn clean package -DskipTests

    # Build Order Service
    - name: Build order-service
      run: |
        cd Microservices/OrderService
        mvn clean package -DskipTests

    # Build Payment Service
    - name: Build payment-service
      run: |
        cd Microservices/PaymentService
        mvn clean package -DskipTests

    # Build Notification Service
    - name: Build notification-service
      run: |
        cd Microservices/NotificationService
        mvn clean package -DskipTests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push eureka-server
      uses: docker/build-push-action@v2
      with:
        context: ./Microservices/eureka-server
        push: true
        tags: aymenessid1/eureka-server:latest

    - name: Build and push api-gateway
      uses: docker/build-push-action@v2
      with:
        context: ./Microservices/API-Gateway
        push: true
        tags: aymenessid1/api-gateway:latest

    - name: Build and push stock-service
      uses: docker/build-push-action@v2
      with:
        context: ./Microservices/StockService
        push: true
        tags: aymenessid1/stock-service:latest

    - name: Build and push order-service
      uses: docker/build-push-action@v2
      with:
        context: ./Microservices/OrderService
        push: true
        tags: aymenessid1/order-service:latest

    - name: Build and push payment-service
      uses: docker/build-push-action@v2
      with:
        context: ./Microservices/PaymentService
        push: true
        tags: aymenessid1/payment-service:latest

    - name: Build and push notification-service
      uses: docker/build-push-action@v2
      with:
        context: ./Microservices/NotificationService
        push: true
        tags: aymenessid1/notification-service:latest

    - name: Build and push angular-frontend
      uses: docker/build-push-action@v2
      with:
        context: ./Microservices/Front
        push: true
        tags: aymenessid1/angular-frontend:latest

    - name: Deploy with Docker Compose
      run: |
        docker-compose pull
        docker-compose up -d
