name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'

      # Build each service with Maven
      - name: Build eureka-server
        run: |
          cd Microservices/eureka-server
          mvn clean package -DskipTests

      - name: Build api-gateway
        run: |
          cd Microservices/API-Gateway
          mvn clean package -DskipTests

      - name: Build stock-service
        run: |
          cd Microservices/StockService
          mvn clean package -DskipTests

      - name: Build order-service
        run: |
          cd Microservices/OrderService
          mvn clean package -DskipTests

      - name: Build payment-service
        run: |
          cd Microservices/PaymentService
          mvn clean package -DskipTests

      - name: Build notification-service
        run: |
          cd Microservices/NotificationService
          mvn clean package -DskipTests

      # Run tests for each service
      - name: Run tests
        run: |
          cd Microservices/PaymentService
          mvn test
          # Repeat for other services as needed

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push Docker images for each service
      - name: Build and push eureka-server
        uses: docker/build-push-action@v2
        with:
          context: ./Microservices/eureka-server
          push: true
          tags: aymenessid1/eureka-server:latest

      # Repeat build and push steps for other services

      # Deploy with Docker Compose from Microservices directory
      - name: Deploy with Docker Compose
        run: |
          cd Microservices
          docker-compose pull
          docker-compose up -d

      # Perform SonarQube analysis using Maven
      - name: SonarQube Analysis
        run: |
          cd Microservices/PaymentService  # Navigate to the Microservices directory
          mvn clean verify sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR }}

      # Additional debug step (optional)
      - name: Show Docker Compose logs
        run: |
          cd Microservices
          docker-compose logs
