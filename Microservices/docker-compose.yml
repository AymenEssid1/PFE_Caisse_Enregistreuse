version: '3.8'

services:
  mysql1:
    container_name: mysql1
    image: mysql
    environment:
      MYSQL_USER: aymen
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: stockDB
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql1:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - my-network

  mysql2:
    container_name: mysql2
    image: mysql
    environment:
      MYSQL_USER: aymen
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: OrderDB
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql2:/var/lib/mysql
    ports:
      - "3307:3306"  # Different host port for the second MySQL instance
    restart: unless-stopped
    networks:
      - my-network


  mysql3:
    container_name: mysql3
    image: mysql
    environment:
      MYSQL_USER: aymen
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: PaymentDB
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql3:/var/lib/mysql
    ports:
      - "3308:3306"  # Different host port for the second MySQL instance
    restart: unless-stopped
    networks:
      - my-network

  mysql4:
    container_name: mysql4
    image: mysql
    environment:
      MYSQL_USER: aymen
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: NotifDB
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - mysql4:/var/lib/mysql
    ports:
      - "3309:3306"  # Different host port for the second MySQL instance
    restart: unless-stopped
    networks:
      - my-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
    networks:
      - my-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - my-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - 8090:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - my-network


  keycloak:
    image: quay.io/keycloak/keycloak:22.0.3
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: BIGBOSS
      KEYCLOAK_ADMIN_PASSWORD: aymen
    ports:
      - "8888:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    command: [ "start-dev" ]  # Use the `start-dev` command for easier development setup
    networks:
      - my-network

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    restart: unless-stopped
    networks:
      - my-network

  api-gateway:
    build:
      context: ./API-Gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8083:8083"
    restart: unless-stopped
    depends_on:
      - eureka-server
    networks:
      - my-network

  stock-service:
    build:
      context: ./StockService
      dockerfile: Dockerfile
    container_name: stock-service
    ports:
      - "8080:8080"  # Adjust port if StockMS runs on a different port
    restart: unless-stopped
    depends_on:
      - mysql1
    networks:
      - my-network


  order-service:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      - mysql2
    networks:
      - my-network

  payment-service:
    build:
      context: ./PaymentService
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      - mysql3
    networks:
      - my-network

  notification-service:
    build:
      context: ./NotificationService
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8086:8084"
    restart: unless-stopped
    depends_on:
      - mysql4
    networks:
      - my-network

  angular-frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
    container_name: angular-frontend
    ports:
      - "4200:4200"
    restart: unless-stopped
    networks:
      - my-network
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8085:80"  # Expose Nginx on port 8085 locally
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Mount your Nginx configuration file
    depends_on:
      - api-gateway  # Ensure Nginx starts after api-gateway
    networks:
      - my-network

networks:
  my-network:
    driver: bridge


volumes:
  mysql1:
  mysql2:
  mysql3:
  mysql4:
  keycloak_data:
