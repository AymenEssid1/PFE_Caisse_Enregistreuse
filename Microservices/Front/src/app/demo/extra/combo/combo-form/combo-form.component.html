
<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="Combo">
      <div class="custom-card">


        <div class="mb-3">
          <h4>Produits</h4>

          <input class="form-control" type="text" placeholder="Recherche" [(ngModel)]="searchText"
            (input)="searchSoldProducts()">
        </div>


        <div class="tables-container">
          <div class="table-container">

            <table class="table">
              <thead>
                <tr>
                  <th>Référence</th>
                  <th>Nom</th>
                  <th>Prix</th>
                  <th>Catégorie</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let soldProduct of filteredSoldProducts">
                  <td>{{ soldProduct.ref }}</td>
                  <td>{{ soldProduct.name }}</td>
                  <td>{{ soldProduct.price }}</td>
                  <td>{{ soldProduct.category.categoryName }}</td>
                  <td>
                    <input type="checkbox" [checked]="selectedSoldProductIds.includes(soldProduct.id)"
                      (change)="toggleSoldProductSelection(soldProduct.id)">
                  </td>
    
                </tr>
              </tbody>
            </table>

          </div>
        </div>
        
      </div>






      <form [formGroup]="comboForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Réference du produit</label>
          <input type="text" class="form-control  white-input" formControlName="ref" id="refstock" placeholder="Réference du combo">

        </div>
        <div class="form-group">
          <label for="name">Nom du Combo</label>
          <input type="text" class="form-control  white-input" formControlName="name" id="name" placeholder="Nom du Produit">

        </div>
        <div class="form-group">
          <label for="name">Prix</label>
          <input type="number" step="any" class="form-control  white-input" formControlName="price" id="price" placeholder="Prix">

        </div>
       
        <div class="form-group">
          <label for="image">Image</label>
          <div class="image-upload-container">

            <div style="width: 30%;">
              <ng-container *ngIf="!imageUrl && !CombotId">
                <div class="image-placeholder">Aucune image sélectionnée</div>
              </ng-container>
              <ng-container *ngIf="!imageUrl && CombotId">
                <img [src]="'http://localhost:8085/gateway/STOCK/combo/image/'+CombotId"  height="200px" width="100%"
                  class="rounded mb-3" />
              </ng-container>
              <ng-container *ngIf="imageUrl">
                <img [src]="imageUrl"  height="200px" class="rounded mb-3" width="100%" />
              </ng-container>
            </div>
            
        
            <!-- Select Image Input -->
            <input type="file" class="form-control" aria-label="file example" id="image"
                   (change)="previewImage($event);validateImage($event);" accept=".jpg, .jpeg, .png"
                   data-browse="Choisir un fichier image" style="width: 100%;" />
        
            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
          <div class="invalid-feedback">Veuillez sélectionner un fichier au format JPG ou PNG.</div>
        </div>

      </form>
    </app-card>





  </div>
