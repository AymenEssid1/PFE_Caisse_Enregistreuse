<div class="auth-wrapper">
    <div class="auth-content">
      <div class="auth-bg">
        <span class="r"></span>
        <span class="r s"></span>
        <span class="r s"></span>
        <span class="r"></span>
      </div>
      <div class="card">
        <div class="card-body text-center">
          <div class="mb-4">
            <i class="feather icon-unlock auth-icon"></i>
          </div>
          <h3 class="mb-4">Réinitialiser mot de passe</h3>
          
          <div class="input-group mb-4">
            <input type="password" class="form-control" placeholder="Mot de passe" [(ngModel)]="password" />
          </div>

          <div class="input-group mb-4">
            <input type="password" class="form-control" placeholder="Confirmer Mot de passe" [(ngModel)]="confirmPassword" />
          </div>
          <div class="form-group text-start mb-4">
            <div class="checkbox checkbox-fill d-inline">
              <input
                type="checkbox"
                name="checkbox-fill-1"
                id="checkbox-fill-a1"
                checked=""
              />
            <!--<label for="checkbox-fill-a1" class="cr"> Save Details</label>-->
            </div>
          </div>
          <button class="btn btn-primary mb-4" (click)="naviagteToLogin()">Confirmer</button>
         
          
        </div>
      </div>
    </div>
  </div>
