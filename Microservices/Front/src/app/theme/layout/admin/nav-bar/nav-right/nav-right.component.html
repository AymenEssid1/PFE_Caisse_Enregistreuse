<ul class="navbar-nav">
  <li>
    <div class="dropdown" ngbDropdown placement="auto">
      <a ngbDropdownToggle href="javascript:">
        <i class="icon feather icon-bell"></i>
        <!-- Ajoutez un badge pour afficher le nombre de nouvelles notifications -->
        <span class="badge badge-pill badge-primary" style="color: blueviolet;" *ngIf="notificationCount>=0">{{ notificationCount }}</span>
      </a>
      <div ngbDropdownMenu class="dropdown-menu dropdown-menu-end notification">
        <div class="notification-head">
          <h6 class="d-inline-block m-b-0">Notifications</h6>
          <div class="float-end">
            <a href="javascript:" class="text-decoration-none" (click)="deleteAllNotifications()">effacer tout</a>
          </div>
        </div>
        <!-- Mettez à jour la liste des notifications pour inclure le message et limiter leur nombre -->
        <ul class="notification-body">
          <!-- Display only the first maxNotificationsDisplayed notifications -->
          <li *ngFor="let notification of notifications" class="notification">
            <div class="d-flex">
              <div class="flex-grow-1">
                <p>
                  <span class="n-time text-muted">
                    <i class="icon feather icon-clock m-r-10"></i>{{ notification.timestamp | date:'short' }}
                  </span>
                  Stock épuisé pour {{notification.establishmentName}}:
                  <li>{{notification.lowStockProducts}}</li>
                </p>
              </div>
            </div>
          </li>
        </ul>
        
        

      </div>
    </div>
  </li>
  
  
  
  <li appToggleFullScreen>
    <a href="javascript:" class="full-screen"
      ><i class="feather icon-maximize"></i
    ></a>
  </li>
  <li>
    <div class="dropdown drp-user" ngbDropdown placement="auto">
      <a href="javascript:" ngbDropdownToggle data-toggle="dropdown">
        <i class="icon feather icon-settings"></i>
      </a>
      <div
        class="dropdown-menu dropdown-menu-end profile-notification"
        ngbDropdownMenu
      >
      <div class="pro-head">
        <img src="assets/images/user/black-usr.png" class="img-radius" alt="User-Profile-Image" />
        
        <span style="margin-left: 10px;">
          {{ firstName }} {{ lastName }}
        </span>
        <!-- <span >
          <ul class="role-list"  style="margin-top: 15px;">
            <li *ngFor="let role of realmRoles">
              <i class="fas fa-check-circle role-icon"></i> 
              {{ role }}
            </li>
          </ul>
        </span> -->
        <a href="javascript:" class="dud-logout" title="Logout" (click)="logout()">
          <i class="feather icon-log-out"></i>
        </a>
      </div>
      
      
      
        
      </div>
    </div>
  </li>
</ul>
