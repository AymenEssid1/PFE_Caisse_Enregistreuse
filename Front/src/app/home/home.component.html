

<igx-navbar class="navbar">
  <igx-navbar-action>
    <button igxButton="icon" igxRipple [igxToggleAction]="navDrawer">
      <igx-icon>
        menu
      </igx-icon>
    </button>
  </igx-navbar-action>
  <igx-navbar-title class="navbar-content">
    <h6 class="h6">
      Caisse+
    </h6>
  </igx-navbar-title>
  <button igxButton="icon" igxRipple>
    <igx-icon>
      search
    </igx-icon>
  </button>
  <button (click)="logout()" igxButton="icon" igxRipple>
    <igx-icon>
      logout
    </igx-icon>
  </button>
</igx-navbar>
<div class="row-layout group">
  <igx-nav-drawer [isOpen]="true" [pin]="true" [pinThreshold]="1024" width="320px" #navDrawer class="nav-drawer">
    <ng-template igxDrawer>
      <igx-list class="list">
        <igx-list-item [isHeader]="false">
          <span igxListLineTitle>foulen ben foulen</span>
          <span igxListLineSubTitle>post mteou</span>
          <span igxListAction>
            <igx-icon class="icon">
              star
            </igx-icon>
          </span>
        </igx-list-item>
      </igx-list>
      <div igxDrawerItem igxRipple routerLink="/establishment">
        <igx-icon class="icon">
          storefront
        </igx-icon>
        <span>points de vente</span>
      </div>
      <div igxDrawerItem igxRipple routerLink="/stock-products">
        <igx-icon class="icon">
          inventory
        </igx-icon>
        <span>Stock Products</span>
      </div>
      <div igxDrawerItem igxRipple routerLink="/sold-products">
        <igx-icon class="icon">
          shopping_cart
        </igx-icon>
        <span>Products</span>
      </div>
      <div igxDrawerItem igxRipple routerLink="/combos">
        <igx-icon class="icon">
          add_shopping_cart
        </igx-icon>
        <span>Combo</span>
      </div>
      <div igxDrawerItem igxRipple routerLink="/discounts">
        <igx-icon class="icon">
          discount
        </igx-icon>
        <span>Promos</span>
      </div>
      
      <div igxDrawerItem igxRipple>
        <igx-icon class="icon">
          dashboard
        </igx-icon>
        <span>View 3</span>
      </div>
      <div igxDrawerItem igxRipple>
        <igx-icon class="icon">
          dashboard
        </igx-icon>
        <span>View 3</span>
      </div>
      <div igxDrawerItem igxRipple>
        <igx-icon class="icon">
          dashboard
        </igx-icon>
        <span>View 3</span>
      </div>
    </ng-template>
  </igx-nav-drawer>
  <div class="view-container">
    <router-outlet></router-outlet>
  </div>
</div>
