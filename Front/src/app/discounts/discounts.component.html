<div class="column-layout group">
  <h5 class="h5">
    Promos
  </h5>
</div>
<div class="column-layout group_1">
  <div class="row-layout group_2">
    <igx-input-group type="border" class="input">
      <input type="text" igxInput />
      <label igxLabel>Recherche</label>
    </igx-input-group>
    <button igxButton="raised" igxRipple [igxToggleAction]="ajouterPromo" class="button">
      Ajouter
    </button>
  </div>
</div>
<div class="column-layout group_3"></div>
<igx-dialog [closeOnOutsideSelect]="true" [closeOnEscape]="true" #ajouterPromo>
  <igx-dialog-title>
    <h5>
      Ajouter un produit
    </h5>
  </igx-dialog-title>
  <ng-container>
    <p class="text">
      Body 1
    </p>
  </ng-container>
  <igx-dialog-actions>
    <button igxButton="flat" igxRipple [igxToggleAction]="ajouterPromo">Cancel</button>
    <button igxButton="flat" igxRipple [igxToggleAction]="ajouterPromo">OK</button>
  </igx-dialog-actions>
</igx-dialog>
<igx-dialog [closeOnOutsideSelect]="true" [closeOnEscape]="true" #modifierPromo>
  <igx-dialog-title>
    <h5>
      Modifier un produit
    </h5>
  </igx-dialog-title>
  <ng-container>
    <p class="text">
      Body 1
    </p>
  </ng-container>
  <igx-dialog-actions>
    <button igxButton="flat" igxRipple [igxToggleAction]="modifierPromo">Cancel</button>
    <button igxButton="flat" igxRipple [igxToggleAction]="modifierPromo">OK</button>
  </igx-dialog-actions>
</igx-dialog>
<igx-dialog [closeOnOutsideSelect]="true" [closeOnEscape]="true" #dialog1>
  <igx-dialog-title>
    <h5>
      Confirmation
    </h5>
  </igx-dialog-title>
  <ng-container>
    <p>Are you sure you want to do this?</p>
  </ng-container>
  <igx-dialog-actions>
    <button igxButton="flat" igxRipple [igxToggleAction]="dialog1">Cancel</button>
    <button igxButton="flat" igxRipple [igxToggleAction]="dialog1">OK</button>
  </igx-dialog-actions>
</igx-dialog>
