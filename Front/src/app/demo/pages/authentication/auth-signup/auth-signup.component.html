<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="feather icon-user-plus auth-icon"></i>
        </div>
        <h3 class="mb-4">Créer un compte</h3>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Nom d'utilisateur" formControlName="username" />
          </div>
          <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Nom" formControlName="lastname" />
          </div>
          <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Prénom" formControlName="firstname" />
          </div>
          <div class="input-group mb-3">
            <input type="email" class="form-control" placeholder="Email" formControlName="email" />
          </div>
          <div class="input-group mb-4">
            <input type="password" class="form-control" placeholder="Mot de Passe" formControlName="password" />
          </div>
          <button type="submit" class="btn btn-primary shadow-2 mb-4">Créer un compte</button>
        </form>
        <p class="mb-0 text-muted">
          Vous avez un compte?
          <a [routerLink]="['/sign-in']"> Se connecter</a>
        </p>
      </div>
    </div>
  </div>
</div>
