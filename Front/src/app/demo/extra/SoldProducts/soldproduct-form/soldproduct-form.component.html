<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="Produits a vendre" >
      <div class="custom-card">

        <div class="tables-container">
          <div class="table-container">
            <table class="table custom-table">
              <thead>
                <tr>
                  <th>Select</th>
                  <th>Category Name</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let category of categories">
                  <td>
                    <input type="radio" name="category" [value]="category" (change)="onCategorySelect(category)"
                      [checked]="selectedCategory3 === category">
                  </td>
                  <td *ngIf="selectedCategory !== category">{{ category.categoryName }}</td>
                  <td *ngIf="selectedCategory === category">
                    <input type="text" [(ngModel)]="newCategoryName" class="form-control">
                  </td>
                  <td>
                    <button  class="btn btn-icon btn-outline-success"*ngIf="selectedCategory !== category" (click)="editCategory(category)"><i class="feather icon-edit"></i></button>
                    <button class="btn btn-icon btn-outline-primary"*ngIf="selectedCategory === category" (click)="updateCategory()"><i class="feather icon-thumbs-up"></i></button>
                    <button class="btn btn-icon btn-outline-danger"(click)="deleteCategory(category.id)"><i class="feather icon-delete"></i></button>


                   
                  </td>
                </tr>
              </tbody>
            </table>
            <div class="add-category-row">
              <input type="text" [(ngModel)]="newCategoryName2" class="form-control" placeholder="Ajouter une categorie">

              <button class="btn btn-outline-primary" style="margin-left: 5px;" (click)="addCategory(establishmentId)">Ajouter</button>
            </div>
          </div>
        
          <div class="table-container">
            <table class="table custom-table">
              <thead>
                <tr>
                  <th>Select</th>
                  <th>Produit de stock</th>
                  <th>Quantité requise</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let stock of stockProducts; let i = index">
                  <td>
                    <input type="checkbox" (change)="onStockProductSelect(stock,i)">
                  </td>
                  <td>{{ stock.name }}</td>
                  <td>
                    <input type="number" [(ngModel)]="selectedQuantities[i]" class="form-control"
                      [disabled]="!selectedStockProducts.includes(stock)">
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <form (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="ref">Ref:</label>
            <input type="text" id="ref" name="ref" class="form-control" [(ngModel)]="newSoldProduct.ref" required>
          </div>
          <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" class="form-control" [(ngModel)]="newSoldProduct.name" required>
          </div>
          <div class="form-group">
            <label for="price">Price:</label>
            <input type="number" id="price" name="price" class="form-control" [(ngModel)]="newSoldProduct.price" required>
          </div>
          <!-- Include other form elements like selecting category and specifying stock equivalents here -->
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>

      </div>
    </app-card>
  </div>
</div>
